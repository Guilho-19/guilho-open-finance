<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <script src="https://cdn.pluggy.ai/pluggy-connect/latest/pluggy-connect.js"></script>
        <link rel="stylesheet" href="style.css">    
    </head>

    <body>
        <h1>Meu Dashboard Financeiro</h1>

        <div class="box">
            <h3>1. Conexão</h3>
            <button id="btn-conectar">Vincular MeuPluggy</button>
            <p><strong>Item ID atual:</strong> <span id="item-id-display">Nenhum</span></p>
        </div>

        <div class="box">
            <h3>2. Saldo das Contas</h3>
            <button id="btn-buscar-contas">Buscar Contas deste Item</button>
            <div id="lista-saldos" class="cards-grid"></div>
            <details style="margin-top: 20px;">
                <summary style="cursor: pointer; color: #555;">Ver JSON bruto retornado pela API</summary>
                <pre id="saida-json">Os dados aparecerão aqui...</pre>
            </details>
        </div>

        <script>
            const itemDisplay = document.getElementById('item-id-display');
            const saidaJson = document.getElementById('saida-json');
            const listaSaldos = document.getElementById('lista-saldos');

            const formatarMoeda = (valor) => {
                return new Intl.NumberFormat('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                }).format(valor);
            };

            let itemIdAtual = localStorage.getItem('meu_pluggy_item_id');
            if (itemIdAtual) {
                itemDisplay.textContent = itemIdAtual;
            }

            document.getElementById('btn-conectar').addEventListener('click', async () => {
                const res = await fetch('/api/connect-token', { method: 'POST' });
                const { accessToken } = await res.json();
                const pluggyConnect = new PluggyConnect({
                    connectToken: accessToken,
                    onSuccess: (itemData) => {
                        itemIdAtual = itemData.item.id;
                        localStorage.setItem('meu_pluggy_item_id', itemIdAtual);
                        itemDisplay.textContent = itemIdAtual;
                        saidaJson.textContent = JSON.stringify(itemData, null, 2);
                    },
                    onError: (erro) => {
                        console.error('Erro na conexão: ', erro);
                    }
                });

                pluggyConnect.init();
            });

            document.getElementById('btn-buscar-contas').addEventListener('click', async () => {
                if (!itemIdAtual) {
                    alert('Vincule o MeuPluggy primeiro para ter um Item ID!');
                    return;
                }
                listaSaldos.innerHTML = 'Carregando...';
                const res = await fetch(`/api/accounts/${itemIDAtual}`);
                const dados = await res.json();
                saidaJson.textContent = JSON.stringify(dados, null, 2);

                listaSaldos.innerHTML = '';

                dados.results.forEach((conta) => {
                    const isCard = conta.type === 'CREDIT';
                    const tipoLegivel = isCard ? 'Cartão de Crédito (Fatura)' : 'Conta Bancária (Saldo)';
                    
                    const card = document.createElement('div');
                    card.className = 'card-conta';
                    card.innerHTML = `
                        <small>${tipoLegivel}</small>
                        <h4>${conta.name}</h4>
                        <p class="saldo ${isCard ? 'credito' : ''}">
                            ${formatarMoeda(conta.balance)}
                        </p>
                    `;

                    listaSaldos.appendChild(card);
                });
            });
        </script>
    </body>
</html>
